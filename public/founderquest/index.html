<style>
  :root{
    /* topographic paper + ink */
    --paper:#E9EAE2;        /* cool map base */
    --paper-2:#F3F3EC;      /* card */
    --paper-3:#FBFBF6;      /* raised */
    --ink:#1E2A28;          /* cartographic ink */
    --ink-2:#3D4845;
    --muted:#79827C;
    --faint:#9AA29B;
    --rule:#D2D4C8;         /* hairlines */
    --rule-2:#C2C5B7;
    --alpine:#1F5A66;       /* primary — contour blue/teal */
    --alpine-d:#16424B;
    --survey:#C25420;       /* sparing accent — survey orange */
    --survey-soft:#E5C9B5;
    --moss:#566F40;         /* cleared / vegetation green */
    --moss-soft:#CDD6BE;

    --f-display:'Archivo',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    --f-read:'Newsreader',Georgia,'Times New Roman',serif;
    --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-display);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  a{color:inherit}
  button{font-family:inherit}
  ::selection{background:var(--survey-soft)}

  /* faint contour texture */
  .topo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:.5}
  .topo path{fill:none;stroke:var(--ink);stroke-width:1;opacity:.05}

  .mono{font-family:var(--f-mono)}
  .label{font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:var(--muted)}

  /* ---------------- HUD ---------------- */
  .hud{
    position:sticky;top:0;z-index:40;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:13px 24px;
    background:var(--paper);
    border-bottom:1px solid var(--rule-2);
  }
  .brand{display:flex;align-items:center;gap:12px;margin-right:auto}
  .brand .mk{width:30px;height:30px;flex:none;color:var(--ink)}
  .brand .mk svg{width:30px;height:30px;display:block}
  .brand .wm{font-family:var(--f-display);font-weight:800;font-size:16px;letter-spacing:.04em;text-transform:uppercase}
  .brand .tag{display:block;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.04em;color:var(--muted);margin-top:1px}

  .readout{font-family:var(--f-mono);font-size:12px;color:var(--ink-2);letter-spacing:.02em;
    border:1px solid var(--rule-2);background:var(--paper-2);padding:6px 11px;border-radius:3px;white-space:nowrap}
  .readout b{color:var(--survey);font-weight:600}

  .txtbtn{background:none;border:0;cursor:pointer;color:var(--ink-2);
    font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:6px 2px;border-bottom:1.5px solid transparent;transition:border-color .15s,color .15s}
  .txtbtn:hover{color:var(--alpine);border-color:var(--alpine)}
  .txtbtn.muted:hover{color:var(--survey);border-color:var(--survey)}

  /* ---------------- LAYOUT ---------------- */
  .wrap{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:30px 24px 70px}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:34px;align-items:start}

  .rail{position:sticky;top:78px;display:flex;flex-direction:column;gap:0}

  .panel{background:var(--paper-2);border:1px solid var(--rule-2);border-radius:4px}

  /* ---- route card (signature: elevation profile) ---- */
  .routecard{padding:18px 18px 16px}
  .routecard .ch{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:4px}
  .rankname{font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.01em;line-height:1.05;margin:2px 0 0}
  .profile{margin:14px 0 8px}
  .profile svg{display:block;width:100%;height:auto}
  .xprow{display:flex;align-items:baseline;justify-content:space-between;font-family:var(--f-mono);
    font-size:12px;color:var(--ink-2);border-top:1px dashed var(--rule-2);padding-top:10px;margin-top:6px}
  .xprow .nx{color:var(--muted)}
  .xprow .nx b{color:var(--alpine)}

  /* ---- route list (camp navigator) ---- */
  .routelist{margin-top:18px;padding:6px 0 4px}
  .routelist .lh{padding:8px 18px 6px}
  .camp{
    display:grid;grid-template-columns:30px 1fr;gap:13px;align-items:center;
    width:100%;text-align:left;background:none;border:0;cursor:pointer;color:var(--ink);
    padding:9px 18px;position:relative;
  }
  .camp:disabled{cursor:not-allowed}
  /* route line behind markers */
  .camp::before{content:"";position:absolute;left:32px;top:-50%;width:1.5px;height:100%;background:var(--rule-2);z-index:1}
  .camp:first-of-type::before{display:none}
  .camp .mark{
    width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;z-index:2;
    font-family:var(--f-mono);font-size:12px;font-weight:600;
    background:var(--paper-2);border:1.5px solid var(--rule-2);color:var(--muted);
  }
  .camp .mark svg{width:14px;height:14px;display:block}
  .camp .nm{font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.15}
  .camp .sub{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.02em;color:var(--faint);margin-top:2px}

  .camp[data-s="active"] .mark{border-color:var(--survey);color:var(--survey);background:var(--paper-3);
    box-shadow:0 0 0 3px rgba(194,84,32,.12)}
  .camp[data-s="active"] .nm{color:var(--ink)}
  .camp[data-s="active"]{background:linear-gradient(90deg,rgba(194,84,32,.06),transparent)}
  .camp[data-s="done"] .mark,.camp[data-s="active-done"] .mark{background:var(--moss);border-color:var(--moss);color:var(--paper-3)}
  .camp[data-s="active-done"]{background:linear-gradient(90deg,rgba(86,111,64,.08),transparent)}
  .camp[data-s="active-done"] .mark{box-shadow:0 0 0 3px rgba(86,111,64,.14)}
  .camp[data-s="done"]::before,.camp[data-s="active-done"]::before{background:var(--moss)}
  .camp[data-s="locked"]{opacity:.45}

  .restart{padding:10px 18px 6px}
  .restart button{background:none;border:0;cursor:pointer;color:var(--faint);font-family:var(--f-mono);
    font-size:11px;letter-spacing:.04em;text-decoration:underline;text-underline-offset:3px;padding:2px 0}
  .restart button:hover{color:var(--survey)}

  /* ---------------- STAGE ---------------- */
  .stage{min-width:0}
  .crumb{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--alpine);
    display:flex;align-items:center;gap:9px}
  .crumb .dot{width:4px;height:4px;border-radius:50%;background:var(--survey)}
  .stage h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.4vw,44px);letter-spacing:-.022em;
    line-height:1.02;margin:11px 0 9px}
  .lede{font-family:var(--f-read);font-size:18.5px;line-height:1.5;color:var(--ink-2);max-width:60ch}

  .principle{margin:24px 0 4px;padding:16px 20px;border-left:2.5px solid var(--alpine);background:var(--paper-3);border-radius:0 4px 4px 0}
  .principle .pl{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .principle p{font-family:var(--f-read);font-size:17px;line-height:1.52;margin:0;color:var(--ink)}
  .principle .src{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--alpine);margin-top:11px}

  .sec{margin-top:36px}
  .sech{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    border-bottom:1px solid var(--rule-2);padding-bottom:9px;margin-bottom:16px}
  .sech h2{font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin:0}
  .sech .ct{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

  /* quests */
  .quest{display:grid;grid-template-columns:24px 1fr auto;gap:15px;align-items:center;
    padding:13px 4px;border-bottom:1px solid var(--rule);cursor:pointer;transition:background .12s}
  .quest:hover{background:var(--paper-3)}
  .quest .box{width:21px;height:21px;border-radius:4px;border:1.5px solid var(--faint);background:var(--paper-3);
    display:grid;place-items:center;flex:none;transition:.14s}
  .quest .box svg{width:13px;height:13px;opacity:0;transform:scale(.5);transition:.16s;color:var(--paper-3)}
  .quest .lab{font-size:14.5px;line-height:1.4}
  .quest .xp{font-family:var(--f-mono);font-size:12px;color:var(--survey);white-space:nowrap}
  .quest[data-done="1"] .box{background:var(--moss);border-color:var(--moss)}
  .quest[data-done="1"] .box svg{opacity:1;transform:scale(1)}
  .quest[data-done="1"] .lab{color:var(--muted)}
  .quest[data-done="1"] .xp{color:var(--moss)}

  /* notebook */
  .note{margin-bottom:18px}
  .note .q{font-family:var(--f-read);font-size:16px;font-style:italic;margin-bottom:8px;display:flex;align-items:center;gap:9px}
  .note .saved{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--moss);
    opacity:0;transition:opacity .2s;font-style:normal}
  .note .saved.show{opacity:1}
  .note textarea{width:100%;min-height:74px;resize:vertical;background:var(--paper-3);
    border:1px solid var(--rule-2);border-radius:4px;color:var(--ink);font-family:var(--f-display);
    font-size:14.5px;line-height:1.5;padding:11px 13px;transition:border-color .15s}
  .note textarea:focus{outline:none;border-color:var(--alpine)}
  .note textarea::placeholder{color:var(--faint)}

  /* gear / tools */
  .gear{display:grid;grid-template-columns:1fr;gap:0}
  .tool{display:grid;grid-template-columns:34px 1fr auto;gap:14px;align-items:center;
    padding:15px 4px;border-bottom:1px solid var(--rule)}
  .tool .ic{width:34px;height:34px;border-radius:4px;flex:none;display:grid;place-items:center;
    font-family:var(--f-display);font-weight:700;font-size:15px;color:var(--ink);
    background:var(--paper-3);border:1.5px solid var(--ink);align-self:start;margin-top:2px}
  .tool .body .nm{font-family:var(--f-display);font-weight:700;font-size:15px}
  .tool .body .why{font-family:var(--f-read);font-size:14px;color:var(--ink-2);line-height:1.42;margin-top:2px;max-width:46ch}
  .tool .visit{display:inline-flex;flex-direction:column;align-items:flex-end;gap:4px;text-decoration:none;white-space:nowrap}
  .tool .visit .go{font-family:var(--f-display);font-weight:600;font-size:13.5px;color:var(--alpine);
    border-bottom:1.5px solid transparent;transition:border-color .15s}
  .tool .visit:hover .go{border-color:var(--alpine)}
  .tool .visit .aff{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:var(--faint)}

  /* stage foot */
  .foot{margin-top:34px;padding:22px;border:1px solid var(--rule-2);border-radius:4px;background:var(--paper-3);
    display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
  .foot .ft{font-size:14px;color:var(--ink-2)}
  .foot .ft b{color:var(--ink);font-weight:700}
  .gobtn{display:inline-flex;align-items:center;gap:9px;border:0;cursor:pointer;
    background:var(--alpine);color:var(--paper-3);font-family:var(--f-display);font-weight:700;font-size:14px;
    letter-spacing:.01em;padding:12px 20px;border-radius:4px;transition:background .15s,transform .1s}
  .gobtn:hover{background:var(--alpine-d)}
  .gobtn:active{transform:translateY(1px)}
  .gobtn svg{width:16px;height:16px}
  .gobtn.dis{background:none;color:var(--faint);border:1px solid var(--rule-2);cursor:not-allowed}

  /* rubber-stamp "cleared" seal */
  .stamp{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    border:2.5px solid var(--survey);color:var(--survey);border-radius:6px;padding:9px 16px;
    transform:rotate(-7deg);position:relative}
  .stamp .big{font-family:var(--f-display);font-weight:800;font-size:17px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
  .stamp .sm{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;margin-top:3px}
  .stamp.press{animation:press .42s cubic-bezier(.2,1.4,.35,1) both}
  @keyframes press{0%{opacity:0;transform:rotate(5deg) scale(1.7)}60%{opacity:1}100%{opacity:1;transform:rotate(-7deg) scale(1)}}
  .summit-line{font-family:var(--f-read);font-style:italic;font-size:15.5px;color:var(--ink)}

  /* ---------------- SEALS MODAL ---------------- */
  .overlay{position:fixed;inset:0;z-index:80;background:rgba(20,26,24,.5);
    display:none;align-items:center;justify-content:center;padding:22px}
  .overlay.open{display:flex}
  .modal{width:min(540px,100%);max-height:86vh;overflow:auto;background:var(--paper-2);
    border:1px solid var(--rule-2);border-radius:5px;padding:24px}
  .modal h3{font-family:var(--f-display);font-weight:800;font-size:20px;letter-spacing:.02em;text-transform:uppercase;margin:0}
  .modal .ms{font-family:var(--f-read);color:var(--ink-2);font-size:15px;margin:4px 0 20px}
  .modal .x{float:right;background:none;border:0;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;margin-top:-4px}
  .modal .x:hover{color:var(--ink)}
  .seals{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seal{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--rule);border-radius:4px;background:var(--paper-3)}
  .seal .disc{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;
    border:1.5px dashed var(--faint);font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--faint)}
  .seal.got{border-color:var(--rule-2)}
  .seal.got .disc{border:2px solid var(--survey);border-style:solid;color:var(--survey)}
  .seal .sn{font-family:var(--f-display);font-weight:700;font-size:13.5px}
  .seal .sd{font-family:var(--f-read);font-size:12px;color:var(--muted);line-height:1.3}

  .colophon{position:relative;z-index:1;max-width:1160px;margin:34px auto 0;padding:0 24px;
    font-family:var(--f-mono);color:var(--faint);font-size:11px;line-height:1.7}
  .colophon code{color:var(--survey)}

  :focus-visible{outline:2px solid var(--alpine);outline-offset:2px;border-radius:2px}

  /* ---------------- RESPONSIVE ---------------- */
  @media (max-width:840px){
    .layout{grid-template-columns:1fr;gap:24px}
    .rail{position:static}
    .seals{grid-template-columns:1fr}
    .readout{order:3}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>

  <g id="contours"></g>
</svg>

<header class="hud">
  <div class="brand">
    <span class="mk" aria-hidden="true">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6">

      </svg>

    <span>
      <span class="wm">Founder Quest</span>

  <div class="readout" id="readout" title="Progress along the route">ELEV 0% · CAMP 01/07</div>

</header>

<div class="wrap">
  <div class="layout">
    <aside class="rail">
      <div class="panel routecard">
        <div class="ch"><span class="label">Current standing</span></div>
        <div class="rankname" id="rankName">Daydreamer</div>

    <section class="stage" id="stage"></section>

</div>

<div class="colophon" id="colophon"></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Seals collected">
    <button class="x" id="sealsClose" aria-label="Close">×</button>
    <h3>Seals</h3>
    <div class="ms">Each camp you clear presses a seal into your route card.</div>
    <div class="seals" id="sealGrid"></div>
  </div>
</div>

/* ============================ STATE ===================================== */
const KEY="founderquest:v1";
const hasStore=(typeof window!=="undefined"&&window.storage&&typeof window.storage.get==="function");
let memBlob=null;
let state={done:{},notes:{},badges:{},complete:{},active:1};

async function loadState(){
  try{
    if(hasStore){const r=await window.storage.get(KEY); if(r&&r.value) return {...state,...JSON.parse(r.value)};}
    else if(memBlob){return {...state,...JSON.parse(memBlob)};}
  }catch(e){}
  return null;
}
let saveTimer=null;
function saveState(){
  const blob=JSON.stringify(state);
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{
    try{ if(hasStore) await window.storage.set(KEY,blob); else memBlob=blob; }
    catch(e){ memBlob=blob; }
  },120);
}

/* ============================ DERIVED =================================== */
function earnedXp(){let x=0;STAGES.forEach(s=>s.quests.forEach(q=>{if(state.done[q.id])x+=q.xp;}));return x;}
function overallPct(){return Math.round(earnedXp()/TOTAL_XP*100);}
function stageDoneCount(s){return s.quests.filter(q=>state.done[q.id]).length;}
function stageXp(s){return s.quests.reduce((a,q)=>a+(state.done[q.id]?q.xp:0),0);}
function stageMaxXp(s){return s.quests.reduce((a,q)=>a+q.xp,0);}
function isStageComplete(s){return s.quests.every(q=>state.done[q.id]);}
function isUnlocked(id){return id===1||state.complete[id-1];}
function rankFor(pct){let r=RANKS[0],nx=null;for(let i=0;i<RANKS.length;i++){if(pct>=RANKS[i].p){r=RANKS[i];nx=RANKS[i+1]||null;}}return{r,nx};}
function currentCampNo(){ for(let i=0;i<STAGES.length;i++){ if(!state.complete[STAGES[i].id]) return STAGES[i].id; } return 7; }

const el=id=>document.getElementById(id);

/* ============================ RENDER ==================================== */
function render(){renderReadout();renderRank();renderProfile();renderCamps();renderStage();renderSealCount();}

function renderReadout(){
  el('readout').innerHTML='ELEV <b>'+overallPct()+'%</b> · CAMP '+String(currentCampNo()).padStart(2,'0')+'/07';
}

function renderRank(){
  const p=overallPct(),{r,nx}=rankFor(p);
  el('rankName').textContent=r.t;
  el('xpNow').textContent=earnedXp()+' / '+TOTAL_XP+' XP';
  if(nx){const need=Math.max(1,Math.ceil((nx.p-p)/100*TOTAL_XP));el('xpNext').innerHTML='<b>'+need+' XP</b> to '+nx.t;}
  else el('xpNext').textContent='top rank reached';
}

/* signature: elevation profile of the 7-camp ascent */
function renderProfile(){
  const W=264,H=78,padL=8,padR=8,padT=10,padB=20;
  const elev=[12,24,37,50,63,77,93]; // % height per camp
  const n=STAGES.length;
  const innerW=W-padL-padR, innerH=H-padT-padB;
  const pts=STAGES.map((s,i)=>{
    const x=padL+(innerW*(i/(n-1)));
    const y=padT+innerH*(1-elev[i]/100);
    return {x,y,s};
  });
  const lastDone=(()=>{let k=-1;STAGES.forEach((s,i)=>{if(state.complete[s.id])k=i;});return k;})();
  const cur=currentCampNo()-1;

  const line=pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');
  const baseY=padT+innerH;

  let dots='';
  pts.forEach((p,i)=>{
    let fill='var(--rule-2)',r=2.6,stroke='none';
    if(i<=lastDone){fill='var(--moss)';r=3;}
    if(i===cur){fill='var(--survey)';r=4;stroke='var(--paper-2)';}
    dots+=`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    dots+=`<text x="${p.x.toFixed(1)}" y="${(baseY+13).toFixed(0)}" text-anchor="middle" font-family="var(--f-mono)" font-size="8" fill="${i===cur?'var(--survey)':'var(--faint)'}">${i+1}</text>`;
  });

  // completed portion of the route drawn solid, rest dashed
  const svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Route elevation profile">
    <line x1="${padL}" y1="${baseY}" x2="${W-padR}" y2="${baseY}" stroke="var(--rule-2)" stroke-width="1"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-opacity="0.28" stroke-dasharray="3 3"/>
    <path d="${pts.slice(0,Math.max(cur+1,1)).map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ')}" fill="none" stroke="var(--alpine)" stroke-width="1.8"/>
    <path d="M${pts[n-1].x.toFixed(1)} ${pts[n-1].y.toFixed(1)} l-3 6 l6 0 z" fill="var(--survey)"/>
    ${dots}
  </svg>`;
  el('profile').innerHTML=svg;
}

function renderCamps(){
  const wrap=el('campList');wrap.innerHTML='';
  STAGES.forEach(s=>{
    const unlocked=isUnlocked(s.id),complete=state.complete[s.id],active=state.active===s.id;
    let st='locked';
    if(complete&&active)st='active-done';else if(active)st='active';else if(complete)st='done';else if(unlocked)st='unlocked';
    const inner=complete?I.check:(unlocked?(s.summit?I.flag:s.id):I.lock);
    const b=document.createElement('button');
    b.className='camp';b.setAttribute('data-s',st);b.disabled=!unlocked;
    b.innerHTML=`<span class="mark">${inner}</span>
      <span><span class="nm">${s.short}</span><span class="sub">${unlocked?s.sub:'LOCKED'}</span></span>`;
    if(unlocked)b.addEventListener('click',()=>{state.active=s.id;saveState();renderCamps();renderStage();window.scrollTo({top:0,behavior:'smooth'});});
    wrap.appendChild(b);
  });
}

function toolRow(k){
  const t=T[k];const init=t.n.replace(/[^A-Za-z0-9]/g,'').charAt(0).toUpperCase();
  return `<div class="tool">
    <span class="ic">${init}</span>
    <span class="body"><span class="nm">${t.n}</span><span class="why">${t.why}</span></span>
    <a class="visit" href="${t.url}" target="_blank" rel="noopener sponsored"><span class="go">Visit ↗</span><span class="aff">Affiliate</span></a>
  </div>`;
}

function renderStage(){
  const s=STAGES.find(x=>x.id===state.active)||STAGES[0];
  const done=stageDoneCount(s),total=s.quests.length;
  el('stage').innerHTML=`
    <div class="crumb"><span class="dot"></span>${s.crumb}</div>
    <h1>${s.title}</h1>
    <p class="lede">${s.lede}</p>
    <div class="principle"><div class="pl">Principle</div><p>${s.principle.text}</p><span class="src">— ${s.principle.src}</span></div>

    <div class="sec">
      <div class="sech"><h2>Quests</h2><span class="ct">${done}/${total} logged · ${stageXp(s)}/${stageMaxXp(s)} XP</span></div>
      <div id="quests"></div>
    </div>

    <div class="sec">
      <div class="sech"><h2>Field notebook</h2><span class="ct">autosaved</span></div>
      <div id="notes"></div>
    </div>

    <div class="sec">
      <div class="sech"><h2>Guide's kit</h2><span class="ct">recommended tools</span></div>
      <div class="gear">${s.tools.map(toolRow).join('')}</div>
    </div>

    <div class="foot" id="foot"></div>`;

  const qf=document.createDocumentFragment();
  s.quests.forEach(q=>{
    const r=document.createElement('div');
    r.className='quest';r.setAttribute('data-done',state.done[q.id]?'1':'0');
    r.innerHTML=`<span class="box">${I.check}</span><span class="lab">${q.label}</span><span class="xp">+${q.xp}</span>`;
    r.addEventListener('click',()=>toggleQuest(q.id,s.id));
    qf.appendChild(r);
  });
  el('quests').appendChild(qf);

  const nl=el('notes');
  s.reflect.forEach(rf=>{
    const w=document.createElement('div');w.className='note';
    w.innerHTML=`<div class="q">${rf.q}<span class="saved" id="sv_${rf.id}">saved</span></div>`;
    const ta=document.createElement('textarea');ta.placeholder=rf.ph;ta.value=state.notes[rf.id]||'';
    let t2=null;
    ta.addEventListener('input',()=>{state.notes[rf.id]=ta.value;saveState();
      const tag=el('sv_'+rf.id);tag.classList.add('show');clearTimeout(t2);t2=setTimeout(()=>tag.classList.remove('show'),900);});
    w.appendChild(ta);nl.appendChild(w);
  });

  renderFoot(s,isStageComplete(s),false);
}

function renderFoot(s,complete,animate){
  const foot=el('foot');const next=STAGES.find(x=>x.id===s.id+1);
  if(complete){
    if(s.summit){
      foot.innerHTML=`<span class="summit-line">Summit reached. You went from zero, to one, to many.</span>
        <span class="stamp ${animate?'press':''}"><span class="big">Summit</span><span class="sm">Camp 07 · cleared</span></span>`;
    }else{
      foot.innerHTML=`<span class="stamp ${animate?'press':''}"><span class="big">Cleared</span><span class="sm">Camp ${String(s.id).padStart(2,'0')}</span></span>
        <button class="gobtn" id="nextBtn">Climb to ${next.title} ${I.arrow}</button>`;
      el('nextBtn').addEventListener('click',()=>{state.active=next.id;saveState();renderCamps();renderStage();window.scrollTo({top:0,behavior:'smooth'});});
    }
  }else{
    const left=s.quests.length-stageDoneCount(s);
    foot.innerHTML=`<span class="ft">Log every quest to clear this camp — <b>${left} left</b>.</span>
      <button class="gobtn dis" disabled>Finish the camp to continue</button>`;
  }
}

/* ============================ ACTIONS =================================== */
function toggleQuest(qid,sid){
  const was=!!state.done[qid];state.done[qid]=!was;
  if(!was)awardSeal('first');
  const s=STAGES.find(x=>x.id===sid);
  const now=isStageComplete(s),wasC=!!state.complete[sid];
  let justCleared=false;
  if(now&&!wasC){state.complete[sid]=true;awardSeal(STAGE_BADGE[sid]);justCleared=true;}
  else if(!now&&wasC){state.complete[sid]=false;}
  saveState();
  renderReadout();renderRank();renderProfile();renderCamps();renderSealCount();
  renderStage();
  // press the stamp only when this toggle just cleared the active camp
  if(justCleared && state.active===sid) renderFoot(s,true,true);
}

function awardSeal(id){if(!state.badges[id])state.badges[id]=Date.now();}
function renderSealCount(){el('sealCount').textContent=Object.keys(state.badges).length+'/'+BADGES.length;}
function renderSeals(){
  el('sealGrid').innerHTML=BADGES.map(b=>{
    const got=!!state.badges[b.id];
    return `<div class="seal ${got?'got':''}"><span class="disc">${got?b.code:'·'}</span>
      <span><span class="sn">${b.n}</span><br><span class="sd">${b.d}</span></span></div>`;
  }).join('');
}

  'Replace each <code>url</code> in the TOOL CATALOG at the top of the source. Progress saves to this device.';

/* faint contour texture */
(function(){
  const base="M-70,-24 C-46,-70 46,-82 82,-34 C112,6 82,64 24,76 C-36,88 -88,40 -70,-24 Z";
  let s='';
  [[1180,180,1],[160,720,1]].forEach(([cx,cy])=>{
    for(let i=1;i<=6;i++){const k=(i*0.55).toFixed(2);s+=`<path transform="translate(${cx},${cy}) scale(${k})" d="${base}"/>`;}
  });
  el('contours').innerHTML=s;
})();

/* boot */
(async function(){const l=await loadState();if(l)state=l;if(!isUnlocked(state.active))state.active=1;render();})();
